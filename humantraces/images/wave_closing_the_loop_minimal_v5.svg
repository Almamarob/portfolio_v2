<svg width="100%" viewBox="0 0 680 426.87" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Onda minimalista con etichette di scambio dati vicine ai picchi e una linea ambra che chiude il loop</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Un'unica onda continua che aumenta di densità da sinistra a destra, con nome e ruolo di ciascun layer. Le etichette di scambio dati sono posizionate appena sopra i rispettivi picchi. Piccoli marcatori ambra allineati alla tangente della curva indicano la direzione dello scambio. Un arco ambra sotto l'onda chiude il ciclo da Layer 3 a Layer 0</desc>
